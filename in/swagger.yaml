    "/api/v1/auth/token": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Get token",
        "description": "Get authorization token",
        "parameters": [
          {
            "name": "authorization-scope",
            "in": "header",
            "description": "The environment where this operation will be executed. This must match with the environment in the url.",
            "required": true,
            "style": "simple",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Accept-Language",
            "in": "header",
            "description": "Specifies the UI culture to be used for localization of messages.",
            "style": "simple",
            "schema": {
              "type": "string",
              "default": "it-IT"
            }
          },
          {
            "name": "Accept-Territory",
            "in": "header",
            "description": "Specifies the culture to be used for data formatting (numbers, dates, currencies). Default: Accept-Language or 'IT'",
            "style": "simple",
            "schema": {
              "type": "string",
              "default": "it-IT"
            }
          }
        ],
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  },
                  "grant_type": {
                    "type": "string"
                  },
                  "scope": {
                    "type": "string"
                  },
                  "token": {
                    "type": "string"
                  }
                }
              },
              "encoding": {
                "username": {
                  "style": "form"
                },
                "password": {
                  "style": "form"
                },
                "grant_type": {
                  "style": "form"
                },
                "scope": {
                  "style": "form"
                },
                "token": {
                  "style": "form"
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "If user is authorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JwtResponse"
                }
              }
            }
          },
          "401": {
            "description": "If user is not authorized"
          },
          "404": {
            "description": "If OAuth authentication is not enabled"
          },
          "409": {
            "description": "If there is an error during the token storage",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          }
        }
      }
    },
