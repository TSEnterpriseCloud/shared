          "accountCode": {
            "minLength": 1,
            "type": "string",
            "description": "PC03_CONTO - Codice conto"
          },
          "accountGroupCode": {
            "type": "number",
            "description": "PC03_CODICE_PC01 - Codice piano dei conti contabilità analitica",
            "format": "double"
          },
          "costNatureCode": {
            "type": "number",
            "description": "PC03_NATURA_PC04 - Codice natura costi",
            "format": "double",
            "nullable": true
          },
          "costSourceType": {
