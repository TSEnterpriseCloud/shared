  "paths": {
    "/api/{product}/auth/token": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Get token",
        "operationId": "authenticate",
        "description": "Get authorization token",
        "x-ai-metadata": {
          "intent": "authentication-token-generation",
          "ai-features": [
            "security-validation",
            "anomaly-detection",
            "token-optimization",
            "access-pattern-analysis"
          ],
          "machine-learning": {
            "models": [
              "security-analyzer",
              "fraud-detector",
              "access-pattern-classifier"
            ],
            "confidence-threshold": 0.9
          },
          "automation": {
            "security-checks": true,
            "anomaly-alerts": true,
            "token-optimization": true
          }
        },
        "parameters": [
          {
            "name": "product",
            "in": "path",
            "description": "The product name where the customer will be created. Supported values are tse10 and tse12.",
            "required": true,
            "schema": {
              "type": "string",
              "default": "tse10",
              "enum": [
                "tse10",
                "tse12"
              ]
            }
          },
          {
            "name": "accept-language",
            "in": "header",
            "description": "Example for multilanguage",
            "style": "simple",
            "schema": {
              "enum": [
                "it-IT",
                "en-GB"
              ],
              "type": "string",
              "default": "it-IT"
            }
          }
        ],
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "scope": {
                    "type": "string"
                  },
                  "token": {
                    "type": "string"
                  }
                }
              },
              "encoding": {
                "username": {
                  "style": "form"
                },
                "scope": {
                  "style": "form"
                },
                "token": {
                  "style": "form"
                }
              },
              "examples": {
                "Default (complete)": {
                  "summary": "Default (complete)",
                  "value": {
                    "username": "user@example.com",
                    "scope": "tse10",
                    "token": "your_authentication_token_here"
                  }
                },
                "Simple request": {
                  "summary": "Minimal authentication request with required fields",
                  "value": {
                    "username": "user@example.com",
                    "scope": "tse10",
                    "token": "your_token"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Authentication successful. JWT token provided.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JwtResponse"
                }
              }
            }
          },
          "400": {
            "description": "Bad Request. Invalid request format or missing required parameters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized. Invalid credentials or expired token.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "404": {
            "description": "OAuth authentication service not available.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "409": {
            "description": "Conflict. Error during token storage or processing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "429": {
            "description": "Too Many Requests. Rate limit exceeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "500": {
            "description": "Internal Server Error. Authentication service unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/{product}/{version}/company/{companyId}": {
      "get": {
        "tags": [
          "Discovery"
        ],
        "summary": "Discovery – hypermedia entry point",
        "operationId": "get-discovery",
        "description": "Returns the HATEOAS links to the available macro-entities for the specified product and company. This is the root entry point for navigating the API.",
        "parameters": [
          {
            "name": "product",
            "in": "path",
            "description": "The product name. Supported values are tse10 and tse12.",
            "required": true,
            "schema": {
              "type": "string",
              "default": "tse10",
              "enum": [
                "tse10",
                "tse12"
              ]
            }
          },
          {
            "name": "version",
            "in": "path",
            "description": "The version of the product.",
            "required": true,
            "schema": {
              "type": "string",
              "default": "v1",
              "minLength": 1,
              "maxLength": 10,
              "pattern": "^[A-Za-z0-9]{1,10}$"
            }
          },
          {
            "name": "companyId",
            "in": "path",
            "description": "The unique identifier of the company.",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 40
            }
          },
          {
            "name": "x-workspace-id",
            "in": "header",
            "description": "Authentication by Workspace-Id",
            "required": false,
            "style": "simple",
            "schema": {
              "type": "string",
              "default": "false",
              "enum": [
                "true",
                "false"
              ]
            },
            "example": "false"
          },
          {
            "name": "accept-language",
            "in": "header",
            "description": "The language preference for the response. Supported values are it-IT and en-GB.",
            "required": true,
            "style": "simple",
            "explode": true,
            "schema": {
              "type": "string",
              "default": "it-IT",
              "enum": [
                "it-IT",
                "en-GB"
              ]
            },
            "example": "it-IT"
          }
        ],
        "responses": {
          "200": {
            "description": "OK. Restituisce i link hypermedia alle macro-entità disponibili.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DiscoveryResponse"
                },
                "examples": {
                  "Default": {
                    "summary": "Discovery links",
                    "value": {
                      "links": [
                        {
                          "href": "/api/tse10/v1/company/1/customers",
                          "rel": "customers",
                          "type": "get",
                          "category": "NAVIGATION"
                        },
                        {
                          "href": "/api/tse10/v1/company/1/warehouse/items",
                          "rel": "warehouse-items",
                          "type": "get",
                          "category": "NAVIGATION"
                        },
                        {
                          "href": "/api/tse10/v1/company/1/finance/movements",
                          "rel": "movements",
                          "type": "get",
                          "category": "NAVIGATION"
                        },
                        {
                          "href": "/api/tse10/v1/company/1/document/orders",
                          "rel": "orders",
                          "type": "get",
                          "category": "NAVIGATION"
                        }
                      ]
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized. Ensure the correct authorization credentials are provided.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Logs"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden. The user does not have permission to perform this operation.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Logs"
                }
              }
            }
          },
          "406": {
            "description": "Not Acceptable. The requested language is not supported.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Logs"
                }
              }
            }
          }
        }
      }
    },
