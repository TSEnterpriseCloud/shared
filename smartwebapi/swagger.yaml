    "/api/{product}/auth/token": {
      "post": {
        "tags": [
          "Auth"
        ],
        "summary": "Get token",
        "description": "Get authorization token",
        "x-ai-metadata": {
          "intent": "authentication-token-generation",
          "ai-features": [
            "security-validation",
            "anomaly-detection",
            "token-optimization",
            "access-pattern-analysis"
          ],
          "machine-learning": {
            "models": [
              "security-analyzer",
              "fraud-detector",
              "access-pattern-classifier"
            ],
            "confidence-threshold": 0.9
          },
          "automation": {
            "security-checks": true,
            "anomaly-alerts": true,
            "token-optimization": true
          }
        },
        "parameters": [
          {
            "name": "product",
            "in": "path",
            "description": "The product name where the customer will be created. Supported values are tse10 and tse12.",
            "required": true,
            "schema": {
              "type": "string",
              "default": "tse10",
              "enum": [
                "tse10",
                "tse12"
              ]
            }
          },
          {
            "name": "accept-language",
            "in": "header",
            "description": "Example for multilanguage",
            "style": "simple",
            "schema": {
              "enum": [
                "it-IT",
                "en-GB"
              ],
              "type": "string",
              "default": "it-IT"
            }
          }
        ],
        "requestBody": {
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "scope": {
                    "type": "string"
                  },
                  "token": {
                    "type": "string"
                  }
                }
              },
              "encoding": {
                "username": {
                  "style": "form"
                },
                "scope": {
                  "style": "form"
                },
                "token": {
                  "style": "form"
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Authentication successful. JWT token provided.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JwtResponse"
                }
              }
            }
          },
          "400": {
            "description": "Bad Request. Invalid request format or missing required parameters.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized. Invalid credentials or expired token.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "404": {
            "description": "OAuth authentication service not available.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "409": {
            "description": "Conflict. Error during token storage or processing.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "429": {
            "description": "Too Many Requests. Rate limit exceeded.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          },
          "500": {
            "description": "Internal Server Error. Authentication service unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthResponse"
                }
              }
            }
          }
        }
