    "/api/{product}/{version}/company/{companyId}/finance/movements/batch": {
      "post": {
        "summary": "Create a new multiple accounting movements",
        "tags": [
          "Finance"
        ],
        "description": "Insert multiple accounting movements into the specified product and version environment.",
        "operationId": "createmovements",
        "parameters": [
          {
            "name": "product",
            "in": "path",
            "description": "The product name where the customer will be created. Supported values are tse10 and tse12.",
            "required": true,
            "schema": {
              "type": "string",
              "default": "tse10",
              "enum": [
                "tse10",
                "tse12"
              ]
            }
          },
          {
            "name": "version",
            "in": "path",
            "description": "The version of the product where the customer will be created.",
            "required": true,
            "schema": {
              "type": "string",
              "default": "v1",
              "minLength": 1,
              "maxLength": 10,
              "pattern": "^[A-Za-z0-9]{1,10}$"
            }
          },
          {
            "name": "companyId",
            "in": "path",
            "description": "The unique identifier of the company where the customer will be created",
            "required": true,
            "schema": {
              "type": "number",
              "format": "int64",
              "maxLength": 5
            }
          },
          {
            "name": "accept-language",
            "in": "header",
            "description": "The language preference for the response. Supported values are it-IT and en-GB.",
            "required": true,
            "style": "simple",
            "explode": true,
            "schema": {
              "type": "string",
              "default": "it-IT",
              "enum": [
                "it-IT",
                "en-GB"
              ]
            },
            "example": "it-IT"
          },
          {
            "name": "user",
            "in": "query",
            "description": "The username of the user performing the operation.",
            "required": false,
            "style": "form",
            "schema": {
              "type": "string",
              "maxLength": 50,
              "pattern": "^[A-Za-z0-9]{3,50}$"
            }
          }
        ],
        "requestBody": {
          "description": "Create a new accounting movements",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Movements"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MovementsResponse"
                }
              }
            }
          }
        }
      }
